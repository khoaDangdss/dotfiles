# --- FONT SETTINGS ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# --- WINDOW LAYOUT & TRANSPARENCY ---
window_padding_width 12
background_opacity   0.85
confirm_os_window_close 0

# Hide window decorations (Hyprland handles borders)
hide_window_decorations yes

# --- CURSOR & SCROLLBACK ---
cursor_shape          block
cursor_blink_interval 0.5
scrollback_lines      10000

# --- SHELL ---
shell /usr/bin/zsh

# --- COLOR SCHEME (Catppuccin Slate/Dark) ---
foreground            #cdd6f4
background            #101a21
selection_foreground  #101a21
selection_background  #f5e0dc

# Cursor colors
cursor                #f5e0dc
cursor_text_color     #101a21

# URL underline color when hovering
url_color             #f5e0dc
url_style			  double
# --- TERMINAL COLORS (ANSI) ---

# Black
color0 #45475a
color8 #585b70

# Red
color1 #f38ba8
color9 #f38ba8

# Green
color2  #a6e3a1
color10 #a6e3a1

# Yellow
color3  #f9e2af
color11 #f9e2af

# Blue
color4  #89b4fa
color12 #89b4fa

# Magenta
color5  #f5c2e7
color13 #f5c2e7

# Cyan
color6  #94e2d5
color14 #94e2d5

# White
color7  #bac2de
color15 #a6adc8

# --- KEYBINDINGS INTEGRATION ---
# Copy / Paste
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Tab management
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
