# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG CONFIGURING TOGETHER WITH THE WIKI FOR MORE INFO.
# #######################################################################################


# --- CẤU HÌNH MÀN HÌNH (MONITORS) ---
# DP-1: trái (extended to left of main display), workspace 1
monitor=DP-1,1366x768,0x0,1
# HDMI-A-1: giữa (primary / main display), 120Hz, workspace 2
monitor=HDMI-A-1,1920x1080@120,1366x0,1
# eDP-1: phải (extended to right of main display), workspace 3
monitor=eDP-1,1366x768,3286x0,1

# Gán workspace mặc định cho từng màn hình
workspace=1,monitor:DP-1,default:true
workspace=2,monitor:HDMI-A-1,default:true
workspace=3,monitor:eDP-1,default:true

# --- BIẾN MÔI TRƯỜNG & PHẦN MỀM MẶC ĐỊNH ---
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun -show-icons
$browser = firefox
# Các lệnh tự động chạy khi khởi động (Ví dụ: Thanh trạng thái, hình nền)
# exec-once = waybar & hyprpaper
exec-once = awww-daemon
exec-once = waybar
exec-once = swaync
#--- DIỆN MẠO (LOOK & FEEL) ---
general {
    gaps_in = 2
    gaps_out = 2
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    #pseudotile = true
    preserve_split = true
}

# --- PHÍM TẮT HỆ THỐNG (KEYBINDINGS) ---
$mainMod = SUPER # Phím Windows / Phím Command trên Mac

# Các phím tắt cơ bản để điều khiển ứng dụng
bind = $mainMod, Return, exec, $terminal       # Mở Terminal (Cần cài đặt kitty trước)
bind = $mainMod, W, killactive,           # Đóng cửa sổ hiện tại
bind = $mainMod, M, exit,                 # Thoát Hyprland ra màn hình đăng nhập
bind = $mainMod, F, exec, $fileManager    # Mở File Manager
bind = $mainMod, V, togglefloating,       # Chuyển cửa sổ sang dạng Floating (nổi)
bind = $mainMod, SPACE, exec, ~/.config/rofi/launchers/type-2/launcher.sh           # Mở Menu ứng dụng (Cần cài rofi)
bind = $mainMod, B, exec, $browser
bind = CTRL ALT, P, exec, ~/.config/hypr/scripts/powermenu.sh
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Di chuyển tiêu điểm giữa các cửa sổ bằng phím mũi tên
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Chuyển đổi giữa các Không gian làm việc (Workspaces) từ 1 đến 10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 0

# Đưa cửa sổ hiện tại sang Không gian làm việc khác
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 0

# Di chuyển và thay đổi kích thước cửa sổ bằng Chuột + Phím $mainMod
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
